<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TravelTech · пример карточки TripPlan</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../../experimental/style.css" />
    <link rel="stylesheet" href="../../experimental/full.css" />
    <link rel="stylesheet" href="../../experimental/trip_plan_card.css" />
    <style>
      .trip-plan-preview { max-width: 1080px; margin: 0 auto; padding: 32px 24px; }
      .trip-plan-preview > header { margin-bottom: 24px; }
      .trip-plan-preview h1 { font-size: 26px; line-height: 1.3; letter-spacing: -0.5px; margin: 8px 0; }
      .trip-plan-preview > header p { max-width: 680px; font-size: 14px; }
      .trip-plan-preview a { color: #195e53; text-underline-offset: 3px; }
      .trip-plan-preview-note { margin-top: 24px; font-size: 13px; color: #526b65; }
      @media (max-width: 740px) {
        .trip-plan-preview { padding: 24px 14px; }
        .trip-plan-preview h1 { font-size: 22px; }
      }
    </style>
    <script src="../../experimental/trip_plan_card.js" defer></script>
    <script src="./preview.js" defer></script>
  </head>
  <body>
    <main class="trip-plan-preview">
      <header>
        <p class="eyebrow">TRAVELTECH · ПРИМЕР КАРТОЧКИ</p>
        <h1>Вся поездка в одном месте</h1>
        <p><strong>MOCK · API не подключён.</strong> Учебные цены и расписание из JSON-примера.
          Поездка не связана с текущим поиском отелей. Бронирование недоступно.</p>
      </header>
      <div id="trip-plan-preview" aria-busy="true">
        <p role="status">Загружаем локальный пример поездки…</p>
      </div>
      <p class="trip-plan-preview-note">
        <a href="./trip_plan_v0.json">Посмотреть входной JSON</a> ·
        <a href="./README.md">Ограничения и проверка</a>
      </p>
    </main>
  </body>
</html>
